<!DOCTYPE html>

<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20fill='%23050505'/%3E%3Cpath%20d='M14%206H5v20h9M5%2016h7'%20fill='none'%20stroke='%23F2F1ED'%20stroke-width='1.6'/%3E%3C/svg%3E">

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background:#050505; }
  body { background:#050505; color:#F2F1ED; font-family:'Instrument Sans',sans-serif; min-height:100dvh; overflow-x:hidden; overflow-y:auto; touch-action:pan-y; -webkit-overflow-scrolling:touch; }
  body.playing { overflow:hidden; touch-action:none; }
  .mono { font-family:'IBM Plex Mono',ui-monospace,monospace; }
  #menu { padding:max(22px,env(safe-area-inset-top)) 24px 48px; max-width:720px; margin:0 auto; }
  #menu header { margin-bottom:28px; }
  #menu header .wm { font-weight:600; font-size:13px; letter-spacing:.42em; }
  #menu header .sub { font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:8px; letter-spacing:.52em; color:#A7ABB1; margin-top:4px; }
  #menu h1 { font-weight:500; font-size:clamp(22px,6vw,34px); line-height:1.2; margin-bottom:6px; }
  #menu p.lead { font-size:13px; line-height:1.6; color:#A7ABB1; max-width:44ch; margin-bottom:22px; }
  .opt { display:block; width:100%; text-align:left; background:none; border:none; border-top:1px solid rgba(242,241,237,.12); padding:16px 0; cursor:pointer; color:#F2F1ED; touch-action:manipulation; }
  .opt:last-of-type { border-bottom:1px solid rgba(242,241,237,.12); }
  .opt .n { font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:10px; letter-spacing:.26em; color:#A7ABB1; }
  .opt .t { display:block; font-weight:500; font-size:clamp(18px,5vw,24px); letter-spacing:.02em; text-transform:uppercase; margin:5px 0 4px; }
  .opt .d { display:block; font-size:12px; line-height:1.5; color:#A7ABB1; max-width:52ch; }
  #stage { position:fixed; inset:0; display:none; background:#050505; z-index:100; height:100dvh; }
  #cv { position:absolute; inset:0; }
  #dom { position:absolute; inset:0; pointer-events:none; }
  #counter { position:absolute; left:50%; bottom:max(5svh,34px); transform:translateX(-50%); font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:10px; letter-spacing:.3em; color:#A7ABB1; white-space:nowrap; }
  #back { position:absolute; top:max(18px,env(safe-area-inset-top)); left:20px; z-index:20; background:none; border:1px solid rgba(242,241,237,.3); color:#F2F1ED; font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:10px; letter-spacing:.24em; padding:11px 16px; cursor:pointer; }
  #replay { position:absolute; top:max(18px,env(safe-area-inset-top)); right:20px; z-index:20; background:none; border:1px solid rgba(242,241,237,.3); color:#F2F1ED; font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:10px; letter-spacing:.24em; padding:11px 16px; cursor:pointer; }
  #demoname { position:absolute; left:50%; top:max(26px,env(safe-area-inset-top)); transform:translateX(-50%); font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:9px; letter-spacing:.3em; color:rgba(167,171,177,.7); white-space:nowrap; }
  #lockup { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; opacity:0; }
  #lockup svg { width:min(86vw,1120px); height:auto; overflow:visible; display:block; }
  #titleblock { position:absolute; right:22px; bottom:max(5svh,34px); border:1px solid rgba(242,241,237,.28); padding:10px 13px; font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:9px; letter-spacing:.18em; color:#A7ABB1; line-height:1.9; opacity:0; text-align:left; }
  #titleblock b { color:#F2F1ED; font-weight:400; }
  #readout { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:clamp(10px,3vw,13px); letter-spacing:.22em; color:#A7ABB1; line-height:2.4; text-align:center; opacity:0; white-space:pre; }
  #readout .lit { color:#F2F1ED; }
</style>
</head>
<body>

<div id="menu">
  <header>
    <div class="wm">EASTMANS</div>
    <div class="sub">DEVELOPMENTS</div>
  </header>
  <h1>Loading screen concepts</h1>
  <p class="lead">Five candidate openings, each in the site's drafting language. Tap one to watch it run, exactly as it would before the site reveals.</p>
  <button class="opt" data-demo="board"><span class="n">01</span><span class="t">The Drawing Board</span><span class="d">The plate registers: grid sweeps in, crosshairs snap, a title block stamps. The loader grid becomes the hero grid.</span></button>
  <button class="opt" data-demo="plotter"><span class="n">02</span><span class="t">The Plotter</span><span class="d">The terrace elevation draws itself at speed, a cursor dot leading every stroke. The finished drawing dissolves into the wordmark.</span></button>
  <button class="opt" data-demo="instrument"><span class="n">03</span><span class="t">The Instrument</span><span class="d">A survey instrument powers on — sweeping lens, rotating ticks, readouts resolving from noise into real coordinates.</span></button>
  <button class="opt" data-demo="section"><span class="n">04</span><span class="t">Section Lines</span><span class="d">Hairlines hatch the screen from the bottom up, then part like a curtain from the centre onto the wordmark.</span></button>
  <button class="opt" data-demo="map"><span class="n">05</span><span class="t">Map to Mark</span><span class="d">East London draws itself street by street, boroughs ping on — then every line condenses into EASTMANS.</span></button>
</div>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="dom">
    <div id="demoname"></div>
    <div id="lockup">
      <svg viewBox="0 0 1180 220" aria-label="Eastmans Developments">
        <g fill="none" stroke-width="3" stroke="#F2F1ED">
          <path d="M285 40 L233 40 L233 140 L285 140 M233 90 L273 90"></path>
          <path d="M325 140 L353 40 L381 140 M336 100 L370 100"></path>
          <path d="M469 52 C463 40 431 38 425 56 C420 71 433 83 445 88 C457 93 471 104 466 120 C461 136 429 140 421 126"></path>
          <path d="M511 40 L567 40 M539 40 L539 140"></path>
          <path d="M607 140 L607 40 L635 96 L663 40 L663 140"></path>
          <path d="M703 140 L731 40 M714 100 L748 100"></path>
          <path d="M731 40 L759 140" stroke="#A7ABB1"></path>
          <path d="M799 140 L799 40 L857 140 L857 40"></path>
          <path d="M945 52 C939 40 907 38 901 56 C896 71 909 83 921 88 C933 93 947 104 942 120 C937 136 905 140 897 126"></path>
        </g>
        <text x="590" y="196" text-anchor="middle" style="font-family:'Instrument Sans',sans-serif;font-size:23px;font-weight:500;letter-spacing:0.58em;fill:#A7ABB1">DEVELOPMENTS</text>
      </svg>
    </div>
    <div id="titleblock"><b>EASTMANS DEVELOPMENTS</b><br>DRAWING 001 — SURVEY<br>SCALE 1:2500 &nbsp;·&nbsp; E17<br>51.5606° N / 0.0053° W</div>
    <div id="readout"></div>
    <div id="counter">000</div>
  </div>
  <button id="back">CLOSE</button>
  <button id="replay">REPLAY</button>
</div>

<script>
(function () {
  'use strict';
  var stage = document.getElementById('stage'), menu = document.getElementById('menu');
  var cv = document.getElementById('cv'), cx = cv.getContext('2d');
  var counter = document.getElementById('counter'), lockup = document.getElementById('lockup');
  var titleblock = document.getElementById('titleblock'), readout = document.getElementById('readout');
  var demoname = document.getElementById('demoname');
  var W = 0, H = 0, DPR = 1, raf = 0, t0 = 0, current = null, done = false;

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function ramp(v, a, b) { return clamp((v - a) / (b - a), 0, 1); }
  function eio(t) { return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function eo(t) { return 1 - Math.pow(1 - t, 3); }
  function pad3(n) { return String(Math.round(n)).padStart(3, '0'); }

  function measure() {
    W = innerWidth; H = innerHeight;
    DPR = Math.min(devicePixelRatio || 1, 2);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px'; cv.style.height = H + 'px'; // replaced element: pin the CSS box
  }
  addEventListener('resize', function () { measure(); });

  function line(x1, y1, x2, y2, a, w, white) {
    if (a <= .004) return;
    var t = white || 0;
    cx.strokeStyle = 'rgba(' + ((167 + 75 * t) | 0) + ',' + ((171 + 70 * t) | 0) + ',' + ((177 + 60 * t) | 0) + ',' + clamp(a, 0, 1) + ')';
    cx.lineWidth = w || 1;
    cx.beginPath(); cx.moveTo(x1, y1); cx.lineTo(x2, y2); cx.stroke();
  }
  function txt(s, x, y, a, size, col, ls) {
    if (a <= .01) return;
    cx.save(); cx.globalAlpha = clamp(a, 0, 1);
    cx.fillStyle = col || '#A7ABB1';
    cx.font = (size || 10) + 'px "IBM Plex Mono",monospace';
    var sp = ls == null ? 2 : ls, cxr = x;
    for (var i = 0; i < s.length; i++) { cx.fillText(s[i], cxr, y); cxr += cx.measureText(s[i]).width + sp; }
    cx.restore();
  }

  // ---------- wordmark geometry (viewBox 1180x220) ----------
  function bez(p0, c1, c2, p1, n) {
    var out = [];
    for (var i = 0; i <= n; i++) {
      var t = i / n, u = 1 - t;
      out.push([u*u*u*p0[0] + 3*u*u*t*c1[0] + 3*u*t*t*c2[0] + t*t*t*p1[0],
                u*u*u*p0[1] + 3*u*u*t*c1[1] + 3*u*t*t*c2[1] + t*t*t*p1[1]]);
    }
    return out;
  }
  function sPoly(ox) {
    var pts = [[469+ox,52]];
    pts = pts.concat(bez([469+ox,52],[463+ox,40],[431+ox,38],[425+ox,56],8).slice(1));
    pts = pts.concat(bez([425+ox,56],[420+ox,71],[433+ox,83],[445+ox,88],8).slice(1));
    pts = pts.concat(bez([445+ox,88],[457+ox,93],[471+ox,104],[466+ox,120],8).slice(1));
    pts = pts.concat(bez([466+ox,120],[461+ox,136],[429+ox,140],[421+ox,126],8).slice(1));
    return pts;
  }
  var CHAINS = [
    { pts: [[285,40],[233,40],[233,140],[285,140]] }, { pts: [[233,90],[273,90]] },
    { pts: [[325,140],[353,40],[381,140]] }, { pts: [[336,100],[370,100]] },
    { pts: sPoly(0) },
    { pts: [[511,40],[567,40]] }, { pts: [[539,40],[539,140]] },
    { pts: [[607,140],[607,40],[635,96],[663,40],[663,140]] },
    { pts: [[703,140],[731,40]] }, { pts: [[714,100],[748,100]] },
    { pts: [[731,40],[759,140]], grey: 1 },
    { pts: [[799,140],[799,40],[857,140],[857,40]] },
    { pts: sPoly(476) }
  ];
  function wordSegs() { // wordmark as flat segments, scaled to viewport
    var s = Math.min(W * .86, 1120) / 1180, ox = (W - 1180 * s) / 2, oy = H / 2 - 110 * s + 20 * s;
    var segs = [];
    CHAINS.forEach(function (ch) {
      for (var i = 1; i < ch.pts.length; i++) {
        var a = ch.pts[i - 1], b = ch.pts[i];
        var n = Math.max(1, Math.ceil(Math.hypot(b[0]-a[0], b[1]-a[1]) / 26));
        for (var k = 1; k <= n; k++) {
          segs.push([ox + (a[0]+(b[0]-a[0])*(k-1)/n) * s, oy + (a[1]+(b[1]-a[1])*(k-1)/n) * s,
                     ox + (a[0]+(b[0]-a[0])*k/n) * s, oy + (a[1]+(b[1]-a[1])*k/n) * s, ch.grey ? 0 : 1]);
        }
      }
    });
    return segs;
  }
  function drawWordmark(prog, alpha) { // stroke-by-stroke draw, like the hero
    var s = Math.min(W * .86, 1120) / 1180, ox = (W - 1180 * s) / 2, oy = H / 2 - 110 * s + 20 * s;
    cx.lineWidth = Math.max(1.2, 3 * s);
    CHAINS.forEach(function (ch, ci) {
      var f = eo(clamp(prog * CHAINS.length * .45 - ci * .32, 0, 1));
      if (f <= 0) return;
      var total = 0, i;
      for (i = 1; i < ch.pts.length; i++) total += Math.hypot(ch.pts[i][0]-ch.pts[i-1][0], ch.pts[i][1]-ch.pts[i-1][1]);
      var lim = total * f, run = 0;
      cx.strokeStyle = ch.grey ? 'rgba(167,171,177,' + alpha + ')' : 'rgba(242,241,237,' + alpha + ')';
      cx.beginPath(); cx.moveTo(ox + ch.pts[0][0]*s, oy + ch.pts[0][1]*s);
      for (i = 1; i < ch.pts.length && run < lim; i++) {
        var a = ch.pts[i-1], b = ch.pts[i], d = Math.hypot(b[0]-a[0], b[1]-a[1]);
        var f2 = Math.min(1, (lim - run) / d); run += d;
        cx.lineTo(ox + (a[0]+(b[0]-a[0])*f2)*s, oy + (a[1]+(b[1]-a[1])*f2)*s);
      }
      cx.stroke();
    });
  }

  // ---------- terrace elevation (24 x 15 unit space) ----------
  function elevSegs() {
    var segs = [], N = 4, HW = 5;
    function push(x1,y1,x2,y2,w){ segs.push([x1,y1,x2,y2,w||0]); }
    push(-1, 13.5, N*HW+1, 13.5, 1);                      // ground
    for (var i = 0; i < N; i++) {
      var x = i * HW;
      push(x,13.5,x,2.2); push(x+HW,13.5,x+HW,2.2);       // party walls
      push(x,2.2,x+HW,2.2); push(x-.1,1.7,x+HW+.1,1.7);   // parapet + cornice
      // chimney
      push(x+1.6,1.7,x+1.6,.4); push(x+3.4,1.7,x+3.4,.4); push(x+1.6,.4,x+3.4,.4);
      // windows: two floors, two per floor
      for (var fy = 0; fy < 2; fy++) {
        var y0 = 3 + fy * 3.1;
        [[.7],[2.9]].forEach(function (wx) {
          var wx0 = x + wx[0];
          push(wx0,y0,wx0+1.4,y0); push(wx0+1.4,y0,wx0+1.4,y0+2.2);
          push(wx0+1.4,y0+2.2,wx0,y0+2.2); push(wx0,y0+2.2,wx0,y0);
          push(wx0,y0+1.1,wx0+1.4,y0+1.1);
        });
      }
      // door + step + bay
      push(x+3.1,13.5,x+3.1,10.2); push(x+4.4,13.5,x+4.4,10.2); push(x+3.1,10.2,x+4.4,10.2);
      push(x+2.9,13.5,x+4.6,13.5,1);
      push(x+.4,13.5,x+.4,10.4); push(x+2.6,13.5,x+2.6,10.4); push(x+.4,10.4,x+2.6,10.4,1);
      push(x+.7,10.9,x+2.3,10.9); push(x+.7,12.8,x+.7,10.9); push(x+2.3,12.8,x+2.3,10.9);
    }
    return segs;
  }

  // ---------- map geometry ----------
  function mapPolys() {
    var P = [], lea = [];
    for (var i = 0; i <= 24; i++) { var t = i / 24; lea.push([.40 + .045*Math.sin(t*5.2+1.2) + .02*Math.sin(t*11), t]); }
    P.push({ pts: lea, a: .55, w: 1.4 });
    P.push({ pts: [[0,.66],[.2,.6],[.42,.55],[.66,.47],[1,.4]], a: .45 });
    P.push({ pts: [[.28,0],[.38,.28],[.5,.6],[.56,.82],[.6,1]], a: .45 });
    P.push({ pts: [[0,.3],[.24,.3],[.5,.34],[.78,.3],[1,.26]], a: .35 });
    P.push({ pts: [[.1,1],[.3,.8],[.52,.72],[.8,.66],[1,.62]], a: .35 });
    P.push({ pts: [[0,.78],[.3,.66],[.62,.52],[1,.44]], a: .4 });
    return P;
  }
  var LOCS = [
    { x:.36, y:.16, n:'WALTHAMSTOW' }, { x:.47, y:.40, n:'LEYTON' }, { x:.15, y:.52, n:'HACKNEY' },
    { x:.51, y:.74, n:'STRATFORD' }, { x:.75, y:.24, n:'WANSTEAD' }, { x:.68, y:.64, n:'FOREST GATE' }
  ];
  function mapRect() {
    var mw = Math.min(W * .84, 640), mh = Math.min(H * .62, mw * 1.05);
    return { x: (W - mw) / 2, y: (H - mh) / 2 - H * .03, w: mw, h: mh };
  }
  function mapSegs(r) {
    var segs = [];
    mapPolys().forEach(function (p) {
      for (var i = 1; i < p.pts.length; i++) {
        segs.push([r.x + p.pts[i-1][0]*r.w, r.y + p.pts[i-1][1]*r.h, r.x + p.pts[i][0]*r.w, r.y + p.pts[i][1]*r.h, 0]);
      }
    });
    LOCS.forEach(function (l, j) {
      var s = (j % 3 - 1) * .012;
      segs.push([r.x+(l.x-.055)*r.w, r.y+(l.y+.028+s)*r.h, r.x+(l.x+.05)*r.w, r.y+(l.y-.006+s)*r.h, 0]);
      segs.push([r.x+(l.x-.04)*r.w, r.y+(l.y+.052+s)*r.h, r.x+(l.x+.06)*r.w, r.y+(l.y+.018+s)*r.h, 0]);
      segs.push([r.x+(l.x-.01)*r.w, r.y+(l.y-.04)*r.h, r.x+(l.x+.022)*r.w, r.y+(l.y+.05)*r.h, 0]);
    });
    return segs;
  }
  function drawPoly(p, r, prog, alpha) {
    var n = p.pts.length - 1, lim = clamp(prog, 0, 1) * n;
    if (lim <= 0) return;
    cx.strokeStyle = 'rgba(167,171,177,' + clamp(alpha * p.a, 0, 1) + ')';
    cx.lineWidth = p.w || 1;
    cx.beginPath(); cx.moveTo(r.x + p.pts[0][0]*r.w, r.y + p.pts[0][1]*r.h);
    for (var i = 1; i <= Math.floor(lim); i++) cx.lineTo(r.x + p.pts[i][0]*r.w, r.y + p.pts[i][1]*r.h);
    var fr = lim - Math.floor(lim), i0 = Math.floor(lim);
    if (fr > 0 && i0 < n) {
      var a = p.pts[i0], b = p.pts[i0+1];
      cx.lineTo(r.x + (a[0]+(b[0]-a[0])*fr)*r.w, r.y + (a[1]+(b[1]-a[1])*fr)*r.h);
    }
    cx.stroke();
  }

  // ---------- demos: each = { name, dur(ms), frame(t01), uses } ----------
  var demos = {};

  demos.board = { name: '01 — THE DRAWING BOARD · PLOTTING', dur: 5200, frame: function (t) {
    var pad = Math.min(W, H) * .08;
    var gx = [], gy = [], i;
    for (i = 1; i <= 5; i++) gx.push(pad + (W - 2*pad) * (i-1) / 4);
    for (i = 1; i <= 4; i++) gy.push(pad + (H - 2*pad) * (i-1) / 3);
    var sweep = eio(ramp(t, .04, .4));
    gy.forEach(function (y, k) {
      var f = eio(ramp(t, .04 + k*.05, .3 + k*.05));
      line(pad, y, pad + (W - 2*pad) * f, y, .16);
    });
    gx.forEach(function (x, k) {
      var f = eio(ramp(t, .16 + k*.05, .42 + k*.05));
      line(x, pad, x, pad + (H - 2*pad) * f, .14);
    });
    // corner registration crosshairs snap in
    [[pad,pad],[W-pad,pad],[pad,H-pad],[W-pad,H-pad]].forEach(function (c, k) {
      var f = ramp(t, .42 + k*.07, .46 + k*.07);
      if (f <= 0) return;
      var l = 12 * eo(f);
      line(c[0]-l, c[1], c[0]+l, c[1], .8, 1, 1); line(c[0], c[1]-l, c[0], c[1]+l, .8, 1, 1);
      if (f < 1) { cx.strokeStyle = 'rgba(242,241,237,' + (.5*(1-f)) + ')'; cx.beginPath(); cx.arc(c[0], c[1], 26*(1-f)+6, 0, 7); cx.stroke(); }
    });
    // centre diagonal construction line
    var dg = eio(ramp(t, .5, .72));
    if (dg > 0) line(W*.5 - W*.22*dg, H*.5 + H*.16*dg, W*.5 + W*.22*dg, H*.5 - H*.16*dg, .2);
    titleblock.style.opacity = eio(ramp(t, .58, .7));
    // wordmark begins on the registered plate
    var wm = ramp(t, .68, .98);
    if (wm > 0) drawWordmark(wm, 1);
    return 'PLOTTING ' + pad3(ramp(t, 0, .9) * 100);
  }, exit: function () { titleblock.style.opacity = 0; } };

  demos.plotter = { name: '02 — THE PLOTTER · SURVEYING', dur: 5600, frame: function (t) {
    var segs = this._segs || (this._segs = elevSegs());
    var s = Math.min(W * .84, 620) / 24, ox = (W - 24*s) / 2 + 2*s, oy = H/2 - 7*s;
    var draw = eio(ramp(t, .04, .68)) * segs.length;
    var fade = 1 - eio(ramp(t, .74, .88));
    var i, last = null;
    for (i = 0; i < segs.length; i++) {
      var f = clamp(draw - i, 0, 1);
      if (f <= 0) break;
      var g = segs[i];
      var x2 = ox + (g[0] + (g[2]-g[0]) * f) * s, y2 = oy + (g[1] + (g[3]-g[1]) * f) * s;
      line(ox + g[0]*s, oy + g[1]*s, x2, y2, (g[4] ? .6 : .42) * fade, 1, g[4] ? .8 : .3);
      if (f < 1) last = [x2, y2];
    }
    if (last && fade > .5) { // plotter head
      cx.fillStyle = 'rgba(242,241,237,.95)';
      cx.fillRect(last[0]-2, last[1]-2, 4, 4);
      line(last[0]-14, last[1], last[0]-6, last[1], .5); line(last[0]+6, last[1], last[0]+14, last[1], .5);
      line(last[0], last[1]-14, last[0], last[1]-6, .5); line(last[0], last[1]+6, last[0], last[1]+14, .5);
    }
    var wm = ramp(t, .8, 1);
    if (wm > 0) drawWordmark(wm, 1);
    return 'SURVEYING E17 · ' + pad3(ramp(t, 0, .78) * 100);
  } };

  demos.instrument = { name: '03 — THE INSTRUMENT · CALIBRATING', dur: 5600,
    LINES: ['LAT 51.5606° N', 'LON 0.0053° W', 'DATUM WALTHAMSTOW E17', 'PLOT RATIO 0.42', 'LEVEL ±0.000'],
    CH: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789°±./',
    frame: function (t) {
      var cxp = W / 2, cyp = H / 2 - H * .04, R = Math.min(W, H) * .27;
      var app = eio(ramp(t, .02, .18));
      // main ring
      cx.strokeStyle = 'rgba(242,241,237,' + (.75*app) + ')'; cx.lineWidth = 1;
      cx.beginPath(); cx.arc(cxp, cyp, R * app, 0, 7); cx.stroke();
      cx.strokeStyle = 'rgba(167,171,177,' + (.3*app) + ')';
      cx.beginPath(); cx.arc(cxp, cyp, R * .62 * app, 0, 7); cx.stroke();
      // rotating tick ring
      var rot = t * 2.2, i;
      for (i = 0; i < 36; i++) {
        var a = i / 36 * Math.PI * 2 + rot, big = i % 9 === 0;
        var r1 = R * (big ? .88 : .93), r2 = R;
        line(cxp + Math.cos(a)*r1, cyp + Math.sin(a)*r1, cxp + Math.cos(a)*r2, cyp + Math.sin(a)*r2, (big ? .7 : .3) * app, 1, big ? .8 : 0);
      }
      // lens sweep
      var sw = rot * 1.6;
      cx.strokeStyle = 'rgba(242,241,237,' + (.5*app) + ')';
      cx.beginPath(); cx.moveTo(cxp, cyp); cx.lineTo(cxp + Math.cos(sw)*R*.62, cyp + Math.sin(sw)*R*.62); cx.stroke();
      cx.strokeStyle = 'rgba(242,241,237,' + (.12*app) + ')';
      cx.beginPath(); cx.moveTo(cxp, cyp);
      cx.arc(cxp, cyp, R*.62, sw - .7, sw); cx.closePath(); cx.stroke();
      // crosshair steadies at centre
      var st = eio(ramp(t, .68, .8)), l = 10 + 6*st;
      line(cxp - l, cyp, cxp + l, cyp, .3 + .6*st, 1, st); line(cxp, cyp - l, cxp, cyp + l, .3 + .6*st, 1, st);
      // scrambled readouts (DOM, monospaced, stable layout)
      var self = this, out = '';
      this.LINES.forEach(function (s2, k) {
        var f = ramp(t, .2 + k*.1, .38 + k*.1);
        var lineS = '';
        for (var j = 0; j < s2.length; j++) {
          lineS += (j / s2.length < f) ? s2[j] : (f > 0 ? self.CH[(Math.random()*self.CH.length)|0] : ' ');
        }
        out += (f >= 1 ? '<span class="lit">' + lineS + '</span>' : lineS) + '\n';
      });
      readout.innerHTML = out;
      readout.style.opacity = ramp(t, .18, .26) * (1 - eio(ramp(t, .82, .9)));
      readout.style.transform = 'translate(-50%,-50%) translateY(' + (R + Math.min(W,H)*.12) + 'px)';
      var wm = ramp(t, .84, 1);
      if (wm > 0) { cx.globalAlpha = 1 - .9*eio(ramp(t, .84, .96)); } // instrument recedes
      if (t > .84) { cx.save(); cx.globalAlpha = 1; drawWordmark(wm, 1); cx.restore(); }
      cx.globalAlpha = 1;
      return 'CALIBRATING ' + pad3(ramp(t, 0, .8) * 100);
    }, exit: function () { readout.style.opacity = 0; } };

  demos.section = { name: '04 — SECTION LINES', dur: 5200, frame: function (t) {
    var n = Math.max(26, Math.round(H / 16));
    var fill = eio(ramp(t, .04, .62));
    var part = eio(ramp(t, .68, .92));
    var i;
    var wm = ramp(t, .7, .95);
    if (wm > 0) drawWordmark(wm, 1); // revealed behind the parting lines
    for (i = 0; i < n; i++) {
      var y = H - (i + .5) * (H / n);
      var on = clamp(fill * n * 1.15 - i, 0, 1);
      if (on <= 0) continue;
      var w2 = W * .5 * on;
      if (part <= 0) {
        line(W/2 - w2, y, W/2 + w2, y, .34, 1, i % 6 === 0 ? .5 : 0);
      } else {
        var gap = (W * .55 + 40) * part;
        var lft = W/2 - gap, rgt = W/2 + gap;
        if (lft > W/2 - w2) line(W/2 - w2, y, lft, y, .34 * (1 - part*.5), 1, 0);
        if (rgt < W/2 + w2) line(rgt, y, W/2 + w2, y, .34 * (1 - part*.5), 1, 0);
      }
    }
    return (t < .68 ? 'SECTION ' + pad3(ramp(t, 0, .62) * 100) : 'EASTMANS — E17');
  } };

  demos.map = { name: '05 — MAP TO MARK · EAST LONDON', dur: 6200, frame: function (t) {
    var r = mapRect();
    var drawP = eio(ramp(t, .03, .42));
    var morph = eio(ramp(t, .55, .82));
    var mapA = (1 - eio(ramp(t, .5, .58)) * 0) * 1; // map lines persist into the morph as segments
    if (morph <= 0) {
      mapPolys().forEach(function (p, i) { drawPoly(p, r, clamp(drawP * 1.6 - i * .06, 0, 1), .9); });
      // borough crosses + labels
      LOCS.forEach(function (l, i) {
        var f = ramp(t, .3 + i*.045, .36 + i*.045);
        if (f <= 0) return;
        var x = r.x + l.x*r.w, y = r.y + l.y*r.h;
        line(x-6, y, x+6, y, .8*f, 1, 1); line(x, y-6, x, y+6, .8*f, 1, 1);
        txt(l.n, x + 10, y - 6, f * (1 - ramp(t, .5, .56)), 9);
      });
      // hatch segs preview fade-in (so handoff is dense)
      var hs = this._ms || (this._ms = mapSegs(r));
      var hf = ramp(t, .44, .55);
      hs.forEach(function (s2, i) { if (i % 2) line(s2[0], s2[1], s2[2], s2[3], .25 * hf); });
    } else {
      var src = this._ms || (this._ms = mapSegs(r));
      var tgt = this._ws || (this._ws = wordSegs());
      var n = Math.max(src.length, tgt.length), i;
      for (i = 0; i < n; i++) {
        var s2 = src[i % src.length], g = tgt[i % tgt.length];
        var lives = i < tgt.length;
        var a2 = lives ? .35 + .65 * morph : .3 * (1 - morph);
        line(s2[0] + (g[0]-s2[0])*morph, s2[1] + (g[1]-s2[1])*morph,
             s2[2] + (g[2]-s2[2])*morph, s2[3] + (g[3]-s2[3])*morph,
             a2, 1 + (Math.max(1.2, 3 * Math.min(W*.86,1120)/1180) - 1) * morph, lives ? morph * (g[4] ? 1 : 0) : 0);
      }
    }
    return (t < .55 ? 'MAPPING EAST LONDON ' + pad3(ramp(t, 0, .5) * 100) : 'EASTMANS — EAST LONDON');
  }, exit: function () { this._ms = null; this._ws = null; } };

  // ---------- runner ----------
  function frame(now) {
    if (!current) return;
    var t = clamp((now - t0) / current.dur, 0, 1);
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx.clearRect(0, 0, W, H);
    var label = current.frame(t);
    counter.textContent = label || '';
    if (t >= 1 && !done) {
      done = true;
      lockup.style.transition = 'opacity .6s ease';
      lockup.style.opacity = 1; // crisp SVG lands over the canvas strokes
    }
    raf = requestAnimationFrame(frame);
  }
  var currentKey = null;
  function start(key) {
    stop();
    currentKey = key;
    current = demos[key];
    current._segs = null; current._ms = null; current._ws = null;
    demoname.textContent = current.name.split(' · ')[0];
    document.body.classList.add('playing');
    stage.style.display = 'block';
    scrollTo(0, 0);
    measure();
    done = false;
    lockup.style.transition = 'none'; lockup.style.opacity = 0;
    titleblock.style.opacity = 0; readout.style.opacity = 0;
    t0 = performance.now();
    raf = requestAnimationFrame(frame);
  }
  function stop() {
    cancelAnimationFrame(raf);
    if (current && current.exit) current.exit();
    current = null;
  }

  document.querySelectorAll('.opt').forEach(function (b) {
    b.addEventListener('click', function () { start(b.dataset.demo); });
  });
  document.getElementById('back').addEventListener('click', function () {
    stop(); stage.style.display = 'none';
    document.body.classList.remove('playing');
  });
  document.getElementById('replay').addEventListener('click', function () {
    if (currentKey) start(currentKey);
  });

  measure();
})();
</script>
</body>
</html>
